apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: quizstar-portal
  labels:
    deployment: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      pod: nginx
  template:
    metadata:
      labels:
        pod: nginx
    spec:
      restartPolicy: Always
      containers:
      - name: nginx-container
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-conf-configmap
          mountPath: /etc/nginx/conf.d/
        - name: staticfiles-volume
          mountPath: /usr/src/staticfiles/
      volumes:
      - name: nginx-conf-configmap
        configMap:
          name: nginx-conf-configmap
      - name: staticfiles-volume
        persistentVolumeClaim:
          claimName: staticfiles-pvc